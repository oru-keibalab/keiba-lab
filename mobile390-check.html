<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>スマホ幅(390px)確認用</title>
<style>
body{margin:0;background:#e5e7eb;font-family:sans-serif;padding:8px}
#lbl{font-size:12px;color:#334155;margin-bottom:4px}
#win{width:390px;height:900px;overflow:hidden;border:1px solid #94a3b8;background:#fff;position:relative}
#f{width:390px;height:2500px;border:0;display:block;position:absolute;left:0;top:0}
</style>
</head><body>
<div id="lbl">390px 幅（iPhone相当）</div>
<div id="win"><iframe id="f" aria-hidden="true" tabindex="-1" src="jra.html"></iframe></div>
<script>
(function(){
  var f=document.getElementById('f'), lbl=document.getElementById('lbl');
  var m=(location.search.match(/mode=([a-z0-9]+)/)||[])[1]||'top';
  var n=0;
  function apply(){
    n++;
    try{
      var d=f.contentDocument;
      if(!d || !d.querySelector('.race-card')){ return; }
      var y=0, cards=d.querySelectorAll('.race-card');
      if(m==='card'){ for(var i=0;i<cards.length;i++){ if(cards[i].querySelector('.rank-badge')){ y=cards[i].getBoundingClientRect().top-6; break; } } }
      else if(m==='last'){ for(var j=cards.length-1;j>=0;j--){ if(cards[j].querySelector('.rank-badge')){ y=cards[j].getBoundingClientRect().top-6; break; } } }
      f.style.top=(-y)+'px';
      lbl.textContent='390px 幅（iPhone相当） '+m+' offset='+Math.round(y);
      setTimeout(apply,1500); setTimeout(apply,3000); setTimeout(apply,5000);
    }catch(e){ lbl.textContent='ERR '+e.message; }
  }
  var t=setInterval(function(){ apply(); if(n>20) clearInterval(t); },300);
})();
</script>
</body></html>
